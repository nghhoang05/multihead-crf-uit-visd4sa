# Hyperparameters for the proposed model (2 independent CRF heads) -- matches
# the hyperparameter table published in the paper (tab:hyperparams-shared).
#
# Single source of truth: `scripts/train.py` reads directly from this file.
# To change a value, edit it HERE and rerun `scripts/train.py`.

# --- Encoder architecture (shared: syllable + character CharLSTM + XLM-R) ---
architecture:
  lstm_hidden: 400          # BiLSTM hidden size per direction (bidirectional -> 800-dim output)
  dropout: 0.33
  use_char: true
  use_contextual: true
  contextual_model_name: "xlm-roberta-large"
  contextual_projected_dim: 100   # XLM-R projected to 100 dims (Section 5.1: all 3 embedding parts are 100-dim)
  freeze_syllable: false          # PhoW2V syllable embedding: fine-tuned
  freeze_contextual: false        # XLM-R: fine-tuned
  syllable_pretrained_source: "PhoW2V_syllables_100dims"  # replaces the paper's dead baomoi.zip link

# --- Data / batching ---
data:
  token_budget: 5000        # dynamic token-budget batching, not a fixed sentence count

# --- Optimizer ---
optimizer:
  name: "AdamW"
  lr: 1.0e-3                 # main learning rate (everything except XLM-R)
  xlmr_lr: 2.0e-5             # separate, much smaller LR for fine-tuning XLM-R
  weight_decay: 1.0e-2        # applied ONLY to CRF params (Eq. 11 in the paper), 0 elsewhere
  grad_clip: 5.0

# --- Training loop ---
training:
  epochs: 30                 # always runs the full epoch count -- no early stopping
                              # (see src/multihead_training.py::train_model)
  use_amp: true               # mixed precision (fp16) on CUDA, auto-disabled on CPU
  checkpoint_selection: "dev_macro_f1_best"   # save the checkpoint with the best dev macro-F1 (exact span match)

# --- Seeds for mean +- std reporting (Tables III, IV, V) ---
seeds: [42, 123, 777, 2024, 2025]

# --- Inference latency (Section IV-B) ---
inference_latency:
  batch_size: 1               # measured at batch_size=1 (real per-sentence latency), not the
                               # token-budget batching used for training/F1 evaluation
  n_warmup_batches: 5
  use_amp: true

# Note: values with no specific Section/Table/Equation citation above (lr, xlmr_lr, epochs,
# checkpoint_selection...) are the team's own technical choices, not numbers mandated by the paper.
